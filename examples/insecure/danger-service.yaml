apiVersion: v1
kind: Service
metadata:
  name: public-nodeport-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: danger
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30080
  - name: kubelet
    port: 10250
    targetPort: 10250
    nodePort: 30250
---
apiVersion: v1
kind: Service
metadata:
  name: public-loadbalancer-service
  namespace: default
spec:
  type: LoadBalancer
  externalIPs:
  - 1.2.3.4
  selector:
    app: not-exist
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: external-name-service
  namespace: default
spec:
  type: ExternalName
  externalName: risky.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: risky-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Debug true;
spec:
  rules:
  - host: "*.example.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: public-nodeport-service
            port:
              number: 80